[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-web-fetch"
version = "0.1.0"
description = "Web reading for AI agents: cheapest first, escalate only when blocked, and always report why a page could not be read. CLI + Python + MCP server + agent skill."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yomin Ma", email = "mrlong0129@users.noreply.github.com" }]
keywords = ["ai-agent", "web-scraping", "mcp", "readability", "trafilatura", "wechat", "llm", "content-extraction", "claude-code", "cursor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
  "lxml_html_clean>=0.1",
  "trafilatura>=1.12",
  "readability-lxml>=0.8.1",
  "mcp>=1.2",  # v1 (FastMCP) and v2 (MCPServer) both supported
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
awf = "agent_web_fetch.cli:main"
awf-mcp = "agent_web_fetch.mcp_server:main"

[project.urls]
Homepage = "https://yomin.love/projects/agent-web-fetch/"
Repository = "https://github.com/mrlong0129/agent-web-fetch"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_web_fetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the network (deselect with -m 'not live')"]
addopts = "-m 'not live'"
